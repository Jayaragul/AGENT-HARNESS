name: quality-gate

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factory-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and integration tests
        env:
          BACKEND: MOCK
        run: pytest --cov --cov-report=term-missing
      - name: Behavioral evaluation gate
        env:
          BACKEND: MOCK
        run: python -m evals.runner --min-score 0.95 --min-pass-rate 0.90
